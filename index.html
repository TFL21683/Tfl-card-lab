<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>TFL Card Lab - Comprehensive Master Intake Portal</title> 
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> 
<style> 
:root { 
    --bg-dark: #04060f; 
    --card-bg: #0b1329; 
    --card-inner: #131e38; 
    --border-color: #1e293b; 
    --neon-blue: #38bdf8; 
    --glow-blue: rgba(56, 189, 248, 0.2); 
    --poke-red: #f43f5e; 
    --poke-gold: #fbbf24; 
    --glow-gold: rgba(251, 191, 36, 0.2); 
    --text-main: #f8fafc; 
    --text-muted: #94a3b8; 
    --success-green: #10b981; 
} 

* { box-sizing: border-box; margin: 0; padding: 0; } 

body { 
    font-family: 'Inter', sans-serif; 
    background: radial-gradient(circle at 50% 0%, #17153b 0%, var(--bg-dark) 70%); 
    color: var(--text-main); 
    padding: 2.5rem 1rem 140px 1rem; 
    display: flex; 
    justify-content: center; 
    min-height: 100vh; 
    position: relative; 
    overflow-x: hidden; 
    line-height: 1.5; 
} 

body::before { 
    content: ""; 
    position: absolute; 
    top: 0; left: 0; right: 0; height: 600px; 
    background: radial-gradient(circle at 50% 15%, rgba(56, 189, 248, 0.07) 0%, transparent 65%); 
    z-index: 0; 
    pointer-events: none; 
} 

.container { 
    max-width: 1140px; 
    width: 100%; 
    background-color: var(--card-bg); 
    border: 1px solid var(--border-color); 
    border-radius: 20px; 
    padding: 2.5rem 3rem; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 40px rgba(56, 189, 248, 0.1); 
    position: relative; 
    z-index: 1; 
} 

header { 
    text-align: center; 
    border-bottom: 2px solid var(--border-color); 
    padding-bottom: 1.8rem; 
    margin-bottom: 2rem; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
} 

h1 { 
    font-family: 'Orbitron', sans-serif; 
    color: var(--poke-gold); 
    font-size: clamp(2.2rem, 5vw, 3rem); 
    font-weight: 900; 
    letter-spacing: 3px; 
    text-transform: uppercase; 
    text-shadow: 0 0 25px var(--glow-gold); 
} 

.portal-section { 
    background-color: var(--card-inner); 
    border: 1px solid var(--border-color); 
    border-radius: 14px; 
    margin-bottom: 1.5rem; 
    overflow: hidden; 
    transition: border-color 0.3s ease, background-color 0.3s ease; 
} 

.portal-section.completed { 
    border-color: var(--success-green); 
    background-color: rgba(16, 185, 129, 0.02); 
} 

.portal-section.completed .portal-section-header { 
    border-bottom-color: var(--success-green); 
    color: var(--success-green); 
    text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); 
} 

.portal-section-header { 
    font-family: 'Orbitron', sans-serif; 
    color: var(--poke-red); 
    font-size: 1.05rem; 
    padding: 1.2rem 1.5rem; 
    background: rgba(4, 6, 15, 0.4); 
    border-bottom: 1px solid var(--border-color); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    cursor: pointer; 
    user-select: none; 
    text-shadow: 0 0 10px rgba(244, 63, 94, 0.3); 
    letter-spacing: 1px; 
    gap: 1rem; 
    transition: color 0.3s ease, border-color 0.3s ease; 
} 

.portal-section-content { 
    padding: 1.8rem; 
    transition: max-height 0.4s ease, padding 0.3s ease, opacity 0.3s ease; 
} 

.form-group { margin-bottom: 1.2rem; position: relative; } 
label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main); font-size: 0.88rem; } 

input[type="text"], input[type="email"], input[type="number"], select { 
    width: 100%; 
    padding: 0.8rem 1rem; 
    background-color: var(--bg-dark); 
    border: 1px solid var(--border-color); 
    border-radius: 9px; 
    color: var(--text-main); 
    font-size: 0.92rem; 
    font-family: 'Inter', sans-serif; 
} 

input:focus, select:focus { 
    outline: none; border-color: var(--poke-gold); box-shadow: 0 0 12px var(--glow-gold); 
} 

.search-results { 
    margin-top: 0.5rem; 
    background: var(--bg-dark); 
    border: 1px solid var(--border-color); 
    border-radius: 9px; 
    max-height: 250px; 
    overflow-y: auto; 
    display: none; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
    z-index: 10; 
    position: absolute; 
    width: 100%; 
} 

.search-item { 
    padding: 10px 14px; 
    cursor: pointer; 
    border-bottom: 1px solid var(--border-color); 
    display: flex; 
    align-items: center; 
    gap: 12px; 
} 
.search-item:hover { background-color: var(--card-inner); } 
.search-item img { height: 42px; border-radius: 6px; } 

.btn-add-card, .btn-submit, .btn-invoice-action {
    background: rgba(56, 189, 248, 0.04);
    border: 2px dashed var(--neon-blue);
    color: var(--neon-blue);
    font-family: 'Orbitron', sans-serif;
    padding: 1rem;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    width: 100%;
    transition: all 0.3s;
}

.btn-submit {
    background: linear-gradient(135deg, var(--poke-red) 0%, #9f1239 100%);
    border: none;
    color: white;
    font-weight: 900;
}

/* Invoice Page View */
.invoice-page-view { 
    display: none; position: fixed; inset: 0; background: #ffffff; color: #0f172a; 
    z-index: 2000; overflow-y: auto; padding: 3rem 2rem; font-family: 'Inter', sans-serif; 
} 
.invoice-sheet { 
    position: relative; max-width: 820px; margin: 0 auto; background: #fff;
} 
.invoice-watermark { 
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg); 
    font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; 
    color: rgba(244, 63, 94, 0.12); letter-spacing: 8px; pointer-events: none; z-index: 1; 
    border: 8px dashed rgba(244, 63, 94, 0.15); padding: 0.5rem 2rem; border-radius: 12px; 
} 
.invoice-header, .invoice-table, .invoice-totals { position: relative; z-index: 2; }
.invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
.invoice-table th, .invoice-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
.invoice-table th { font-family: 'Orbitron', sans-serif; background: #f1f5f9; color: #475569; }

/* FIX: Strict Print Enforcement for Watermark */
@media print { 
    body * { visibility: hidden; } 
    #invoicePageView, #invoicePageView * { visibility: visible; } 
    #invoicePageView { 
        position: absolute; left: 0; top: 0; width: 100%; height: auto !important; 
        background: white !important; display: block !important; padding: 0; 
    } 
    .invoice-watermark {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color: rgba(244, 63, 94, 0.25) !important; /* Enhanced opacity for ink transfer */
        border-color: rgba(244, 63, 94, 0.25) !important;
    }
} 
</style> 
</head> 
<body> 

<div class="container">
    <header>
        <h1>TFL Card Lab</h1>
        <div style="font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 0.9rem;">Master Intake Portal</div>
    </header>

    <!-- SECTION 1: CUSTOMER INFO -->
    <div id="section1" class="portal-section">
        <div class="portal-section-header">
            <span>1. Client Data</span>
        </div>
        <div class="portal-section-content">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="clientName" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="clientEmail" placeholder="Enter email">
            </div>
        </div>
    </div>

    <!-- SECTION 2: CARD INTAKE (LIVE SEARCH FIX) -->
    <div id="section2" class="portal-section">
        <div class="portal-section-header">
            <span>2. TCG Card Identification & Intake</span>
        </div>
        <div class="portal-section-content">
            <div class="form-group">
                <label>Live Card Search (Pokémon TCG API)</label>
                <input type="text" id="cardSearchInput" placeholder="Search by name (e.g. Charizard)...">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div id="selectedCardDisplay" style="display:none; margin-top:1rem; border: 1px solid var(--neon-blue); padding: 1rem; border-radius: 8px;">
                <h4 id="scName" style="color:var(--poke-gold); font-family: 'Orbitron', sans-serif;"></h4>
                <p style="font-size:0.85rem; color:var(--text-muted);">Market Value: <span id="scPrice" style="color:var(--success-green);"></span></p>
                <input type="hidden" id="finalCardVal">
            </div>
        </div>
    </div>

    <!-- SECTION 3: PRICING / SUBMISSION -->
    <div id="section3" class="portal-section">
        <div class="portal-section-header">
            <span>3. Service Selection & Finalization</span>
        </div>
        <div class="portal-section-content">
            <div class="form-group">
                <label>Select Restoration Tier</label>
                <select id="serviceTier">
                    <option value="">-- Choose Tier --</option>
                    <option value="basic">Tier 1: Basic Cleaning ($15)</option>
                    <option value="moderate">Tier 2: Scratch Removal ($35)</option>
                    <option value="heavy">Tier 3: Heavy Restoration ($60)</option>
                </select>
            </div>
            <button class="btn-invoice-action" onclick="generateInvoice()">Generate Printable Invoice</button>
        </div>
    </div>
</div>

<!-- INVOICE OVERLAY -->
<div id="invoicePageView" class="invoice-page-view">
    <div class="invoice-sheet">
        <div class="invoice-watermark">TFL CARD LAB</div>
        <div class="invoice-header">
            <div>
                <h2 style="font-family: 'Orbitron', sans-serif;">TFL CARD LAB</h2>
                <p>Master Intake Invoice</p>
            </div>
            <div style="text-align: right;">
                <button onclick="window.print()" style="padding:0.5rem 1rem; background:#0f172a; color:#fff; cursor:pointer; border:none; font-family:'Orbitron', sans-serif;">Print Sheet</button>
                <button onclick="closeInvoice()" style="padding:0.5rem 1rem; background:#f43f5e; color:#fff; cursor:pointer; border:none; margin-left: 0.5rem; font-family:'Orbitron', sans-serif;">Close</button>
            </div>
        </div>
        
        <div style="margin-bottom: 2rem;">
            <strong>Client: </strong> <span id="invClient"></span><br>
            <strong>Email: </strong> <span id="invEmail"></span>
        </div>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Item Description</th>
                    <th>Market Value</th>
                    <th>Service Tier</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="invCardName">--</td>
                    <td id="invCardPrice">--</td>
                    <td id="invService">--</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- SECTION COMPLETION LOGIC (FIX #2) ---
    // Actively monitors inputs to dynamically assign the green '.completed' class.
    const clientName = document.getElementById('clientName');
    const clientEmail = document.getElementById('clientEmail');
    const cardSearchInput = document.getElementById('cardSearchInput');
    const finalCardVal = document.getElementById('finalCardVal');
    const serviceTier = document.getElementById('serviceTier');

    function checkSection1() {
        const sec = document.getElementById('section1');
        if(clientName.value.trim() !== '' && clientEmail.value.trim() !== '') {
            sec.classList.add('completed');
        } else {
            sec.classList.remove('completed');
        }
    }

    function checkSection2() {
        const sec = document.getElementById('section2');
        if(finalCardVal.value.trim() !== '') {
            sec.classList.add('completed');
        } else {
            sec.classList.remove('completed');
        }
    }

    function checkSection3() {
        const sec = document.getElementById('section3');
        if(serviceTier.value !== '') {
            sec.classList.add('completed');
        } else {
            sec.classList.remove('completed');
        }
    }

    [clientName, clientEmail].forEach(input => input.addEventListener('input', checkSection1));
    serviceTier.addEventListener('change', checkSection3);

    // --- LIVE API SEARCH (FIX #3) ---
    // Connects to Pokemon TCG API to fetch real market data dynamically.
    let searchTimeout;
    const searchResults = document.getElementById('searchResults');

    cardSearchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value.trim();
        
        if (query.length < 3) {
            searchResults.style.display = 'none';
            return;
        }

        searchTimeout = setTimeout(async () => {
            try {
                // Utilizing the public v2 API for live market pricing context
                const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=name:"${query}*"&pageSize=5`);
                const data = await res.json();
                
                searchResults.innerHTML = '';
                if(data.data.length > 0) {
                    searchResults.style.display = 'block';
                    data.data.forEach(card => {
                        const price = card.tcgplayer?.prices?.holofoil?.market || card.tcgplayer?.prices?.normal?.market || 'N/A';
                        const div = document.createElement('div');
                        div.className = 'search-item';
                        div.innerHTML = `
                            <img src="${card.images.small}" alt="card thumb">
                            <div>
                                <div style="font-weight:600; color:var(--text-main);">${card.name} (${card.set.name})</div>
                                <div style="font-size:0.8rem; color:var(--success-green);">Market: $${price}</div>
                            </div>
                        `;
                        div.onclick = () => selectCard(card.name, price);
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'none';
                }
            } catch (err) {
                console.error("API Fetch Error:", err);
            }
        }, 500); // 500ms debounce to prevent API spam
    });

    function selectCard(name, price) {
        document.getElementById('scName').innerText = name;
        document.getElementById('scPrice').innerText = price === 'N/A' ? 'Price Unavailable' : `$${price}`;
        finalCardVal.value = name;
        
        document.getElementById('selectedCardDisplay').style.display = 'block';
        searchResults.style.display = 'none';
        cardSearchInput.value = '';
        
        // Trigger Section 2 Validation
        checkSection2();
    }

    // --- INVOICE GENERATION ---
    function generateInvoice() {
        document.getElementById('invClient').innerText = clientName.value || 'N/A';
        document.getElementById('invEmail').innerText = clientEmail.value || 'N/A';
        document.getElementById('invCardName').innerText = finalCardVal.value || 'No Card Selected';
        document.getElementById('invCardPrice').innerText = document.getElementById('scPrice').innerText || 'N/A';
        
        const tierText = serviceTier.options[serviceTier.selectedIndex].text;
        document.getElementById('invService').innerText = serviceTier.value === '' ? 'No Service Selected' : tierText;

        document.getElementById('invoicePageView').style.display = 'block';
    }

    function closeInvoice() {
        document.getElementById('invoicePageView').style.display = 'none';
    }
</script>
</body>
</html>
